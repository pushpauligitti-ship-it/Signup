<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<link rel="stylesheet" href="bootstrap.css">
<link rel="stylesheet" href="mdb.css">
<link rel="stylesheet"href="https://use.fontawesome.com/releases/v5.8.1/css/all.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<style>
  .image{
    background:url("sky.jpg");
    background-repeat:no-repeat;
  }
  .down{
    margin-top: 50px;
  }
  body{
    background-image: linear-gradient(to right top, #d16b90, #b46990, #97678a, #7e637f, #685e6f, #6a6571, #6e6c72, #737373, #8b8b8b, #a5a5a5, #bebebe, #d9d9d9);
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
</style>
</head>
<body>
<div class="container">
        <div class="row down">
            <div class="col-md-4 offset-md-2 border text-center bg-light mt-5">
                <i class="fa fa-user fa-3x mt-4"></i>
                <h2>SignUp</h2>
    <div class="col-auto">
      <label class="sr-only" for="inlineFormInputGroup">Username</label>
      <div class="input-group mb-2">
        <div class="input-group-prepend">
          <div class="input-group-text"><i class="fa fa-user"></i></div>
        </div>
        <input type="text" class="form-control" id="inlineFormInputGroup" placeholder="Enter full name">
      </div>
    </div>
    <div class="col-auto">
      <label class="sr-only" for="inlineFormInputGroup">mail</label>
      <div class="input-group mb-2">
        <div class="input-group-prepend">
          <div class="input-group-text"><i class="fa fa-envelope"></i></div>
        </div>
        <input type="text" class="form-control" id="inlineFormInputGroup" placeholder="Enter Email">
      </div>
    </div>
    <div class="col-auto">
      <label class="sr-only" for="inlineFormInputGroup">password</label>
      <div class="input-group mb-2">
        <div class="input-group-prepend">
          <div class="input-group-text"><i class="fa fa-lock"></i></div>
        </div>
        <input type="text" class="form-control" id="inlineFormInputGroup" placeholder="Password">
      </div>
    </div>
    <div class="col-auto">
      <label class="sr-only" for="inlineFormInputGroup">Confirm Password</label>
      <div class="input-group mb-2">
        <div class="input-group-prepend">
          <div class="input-group-text"><i class="fa fa-lock"></i></div>
        </div>
        <input type="text" class="form-control" id="inlineFormInputGroup" placeholder="Confirm Password">
      </div>
    </div>
    <div class="container text-center p-3">
        <button class="btn btn-success badge-pill">SignUp</button>
    </div>
</div>
    <div class="col-md-4 border text-center mt-5 image">
        <h3 class="mt-3 text-white">Sign In With <br> Social Media <br></h3>
        <button class="btn btn-primary mt-3"> <i class=" h5 bi bi-facebook"></i>  Sign in with facebook  </button>
        <button class="btn btn-warning mt-3">  <i class=" h5 bi bi-google"></i>  Sign in with google </button>
        <button class="btn btn-danger mt-3"> <i class=" h5 bi bi-instagram"></i>  Sign in with instagram </button>

    </div>
</div>  
    <script src="jquery.js"></script>
    <script src="popper.js"></script>
    <script src="bootstrap.js"></script>
    <script src="mdb.js"></script>
</body>
</html>
